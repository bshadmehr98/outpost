[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outpost-airgap"
version = "0.1.0"
description = "Air-gapped infrastructure from your laptop: fetch what your projects need, serve it from one sealed Gitea, and run Docker, Swarm or k3s on servers that never touch the internet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

keywords = ["air-gap", "airgapped", "offline", "gitea", "docker", "swarm", "k3s", "mirror", "pypi", "npm", "apt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
outpost = "outpost.cli:main"

[project.urls]
Homepage = "https://github.com/bshadmehr98/outpost"
Documentation = "https://github.com/bshadmehr98/outpost/tree/main/docs"
Changelog = "https://github.com/bshadmehr98/outpost/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["outpost*"]

[tool.setuptools.package-data]
outpost = ["ui/*.html", "templates/lab/*", "templates/platform/*", "templates/platform/.gitignore", "templates/platform/needs/*", "templates/platform/needs/*.example", "templates/platform/demo/*", "templates/platform/demo/app/*", "templates/platform/demo/app/templates/*", "templates/platform/checks/*", "templates/platform/checks/*/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["outpost", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so `from tests.conftest import FakeHost` works under a plain `pytest`, not only `python -m pytest`
markers = ["integration: needs Docker and the internet (run with OUTPOST_INTEGRATION=1)"]
