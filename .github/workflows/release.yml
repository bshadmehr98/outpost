# A tag v* builds the package, publishes it to PyPI (trusted publishing: add this repository and
# workflow as a publisher on pypi.org for the project outpost-airgap, no token needed) and makes a
# GitHub release with the archives and the matching CHANGELOG section.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - run: pip install dist/*.whl && test "v$(outpost --version | awk '{print $2}')" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Notes from the changelog
        run: awk -v tag="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, tag) > 0} p' CHANGELOG.md > notes.md
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
