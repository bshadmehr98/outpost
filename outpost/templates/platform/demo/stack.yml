# Swarm deploy. The workflow runs: IMAGE=... INFRA=prod PORT=8080 docker stack deploy -c stack.yml demo-prod
# Two replicas; the swarm's routing mesh answers on every node.
services:
  web:
    image: ${IMAGE}
    ports:
      - "${PORT:-8080}:8000"
    # the egress proxy's variables; `outpost infra setup` always writes this file (only a comment without a proxy)
    env_file: /etc/outpost/proxy.env
    environment:
      INFRA: ${INFRA:-prod}
      NODE: "{{.Node.Hostname}}"
    deploy:
      replicas: 2
      update_config:
        order: start-first
