# k3s deploy. The workflow substitutes __IMAGE__, __INFRA__ and __PORT__ and pipes this into kubectl apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      containers:
        - name: web
          image: __IMAGE__
          ports: [{containerPort: 8000}]
          env:
            - {name: INFRA, value: "__INFRA__"}
            - name: NODE
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            timeoutSeconds: 5     # /healthz measures the internet; a dropped packet takes 2 s to give up
---
apiVersion: v1
kind: Service
metadata:
  name: demo
spec:
  type: NodePort
  selector: {app: demo}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: __PORT__
