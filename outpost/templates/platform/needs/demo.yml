# The demo project in demo/. Delete this file and the folder once you have your own projects.
name: demo
python: "3.12"

images:
  - python:3.12-slim          # lands as <gitea>/pkgs/library--python:3.12-slim; the Dockerfile names that
  - alpine:3.20               # used by the hello-k3s smoke check, as pkgs/library--alpine:3.20

pypi:
  - file: ../demo/requirements.txt

apt:
  distro: bookworm            # python:3.12-slim is Debian bookworm
  packages: [curl]
