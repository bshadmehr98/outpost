<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpost</title>
<style>
  :root {
    --bg:#f6f7f5; --card:#ffffff; --ink:#15191e; --ink-2:#3b434d; --muted:#6f7883; --line:#e4e7e2; --line-2:#d3d8d1; --soft:#f0f2ee; --soft-2:#e8ebe6;
    --accent:#0e7067; --accent-hover:#0a5a52; --accent-ink:#ffffff; --accent-soft:#e0f1ee; --accent-line:#b7ddd6;
    --ok:#1a7f45; --ok-soft:#e3f4ea; --warn:#a85d0a; --warn-soft:#fdf1df; --bad:#b4232c; --bad-soft:#fbe7e8; --info:#2b5fb3; --info-soft:#e6eefb;
    --nav:#111518; --nav-ink:#e6e9ec; --nav-muted:#8d97a3; --nav-line:#242a30; --nav-active:#1c2228;
    --term:#0d1117; --term-ink:#d6dde6;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --r:14px; --r-s:9px; --shadow:0 1px 1px rgba(16,20,24,.04), 0 10px 30px -18px rgba(16,20,24,.25);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0c0f12; --card:#14181d; --ink:#e7eaee; --ink-2:#c3c9d1; --muted:#8f99a5; --line:#232a31; --line-2:#2e363f; --soft:#1a1f25; --soft-2:#20262d;
    --accent:#36c7b6; --accent-hover:#5ad6c7; --accent-ink:#06211d; --accent-soft:#12302c; --accent-line:#1f4a44;
    --ok:#4ade80; --ok-soft:#12301c; --warn:#fbbf24; --warn-soft:#3a2a0c; --bad:#f87171; --bad-soft:#3b1515; --info:#7aa7f0; --info-soft:#15243d;
    --shadow:0 1px 1px rgba(0,0,0,.4);
  } }
  :root[data-theme="dark"] {
    --bg:#0c0f12; --card:#14181d; --ink:#e7eaee; --ink-2:#c3c9d1; --muted:#8f99a5; --line:#232a31; --line-2:#2e363f; --soft:#1a1f25; --soft-2:#20262d;
    --accent:#36c7b6; --accent-hover:#5ad6c7; --accent-ink:#06211d; --accent-soft:#12302c; --accent-line:#1f4a44;
    --ok:#4ade80; --ok-soft:#12301c; --warn:#fbbf24; --warn-soft:#3a2a0c; --bad:#f87171; --bad-soft:#3b1515; --info:#7aa7f0; --info-soft:#15243d;
    --shadow:0 1px 1px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font:14.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  code, pre, .mono { font-family:var(--mono); font-size:.9em; }
  code { background:var(--soft); border:1px solid var(--line); padding:0 5px; border-radius:5px; }
  svg.i { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:-3px; }
  svg.i.lg { width:20px; height:20px; }
  h1, h2, h3, h4 { margin:0; font-weight:650; letter-spacing:-.01em; }

  /* ---------- sidebar ---------- */
  nav { width:264px; flex:none; background:var(--nav); color:var(--nav-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand { padding:20px 20px 10px; display:flex; align-items:center; gap:10px; }
  .brand .mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#2dd4bf,#0e7067); display:grid; place-items:center; color:#06211d; font-weight:800; font-size:15px; }
  .brand h1 { font-size:17px; color:#fff; }
  .brand small { display:block; font-size:11px; color:var(--nav-muted); font-weight:400; letter-spacing:.02em; }
  .folder { margin:0 14px 10px; padding:8px 10px; border-radius:8px; background:var(--nav-active); font-family:var(--mono); font-size:11px; color:var(--nav-muted); word-break:break-all; line-height:1.4; }
  .navsec { padding:10px 20px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--nav-muted); }
  .navlist { list-style:none; margin:0; padding:0 10px; }
  .navlist li { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--nav-ink); font-size:13.5px; position:relative; }
  .navlist li:hover { background:var(--nav-active); }
  .navlist li.active { background:var(--nav-active); color:#fff; }
  .navlist li.active::before { content:""; position:absolute; left:-10px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--accent); }
  .navlist .num { width:22px; height:22px; border-radius:50%; border:1.5px solid #3a434d; display:grid; place-items:center; font-size:11px; font-weight:600; color:var(--nav-muted); flex:none; }
  .navlist li.done .num { background:#1f8a4c; border-color:#1f8a4c; color:#fff; }
  .navlist li.problem .num { background:#c0392b; border-color:#c0392b; color:#fff; }
  .navlist li.partial .num { border-color:#2dd4bf; color:#2dd4bf; }
  .navlist li.busy .num { border-color:#2dd4bf; border-top-color:transparent; animation:spin .9s linear infinite; color:transparent; }
  .navlist li .sub { margin-left:auto; font-size:11px; color:var(--nav-muted); }
  .rail { flex:1; overflow:auto; padding-bottom:10px; }
  .navfoot { border-top:1px solid var(--nav-line); padding:12px 14px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--nav-muted); }
  .navfoot .state { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
  .navfoot .state span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .navfoot .dotp { width:8px; height:8px; border-radius:50%; background:#3a434d; flex:none; }
  .navfoot .dotp.on { background:#2dd4bf; animation:blink 1s infinite; }
  .navfoot button { background:none; border:1px solid var(--nav-line); color:var(--nav-muted); padding:4px 7px; border-radius:7px; cursor:pointer; display:inline-flex; }
  .navfoot button:hover { color:#fff; }
  @keyframes spin { to { transform:rotate(360deg); } } @keyframes blink { 50% { opacity:.25; } }

  /* ---------- page ---------- */
  main { flex:1; min-width:0; }
  .page { max-width:960px; margin:0 auto; padding:30px 40px 90px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
  .head h2 { font-size:26px; display:flex; align-items:center; gap:12px; }
  .head .stepno { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:4px; }
  .head p { margin:4px 0 0; color:var(--muted); font-size:15px; }
  .head .right { text-align:right; font-size:13px; color:var(--muted); white-space:nowrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:16px; }
  .card > .hd { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line); }
  .card > .hd h3 { font-size:15px; flex:1; display:flex; align-items:center; gap:9px; }
  .card > .hd h3 svg { color:var(--muted); }
  .card > .hd small { color:var(--muted); font-weight:400; margin-left:4px; }
  .card > .bd { padding:18px 20px; }
  .card > .bd.tight { padding:6px 20px; }
  .card > .ft { padding:12px 20px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:color-mix(in srgb, var(--soft) 50%, transparent); border-radius:0 0 var(--r) var(--r); }
  .explain { display:flex; gap:14px; padding:14px 18px; border-radius:var(--r); background:var(--info-soft); color:var(--ink-2); margin-bottom:16px; font-size:14px; line-height:1.55; }
  .explain svg { color:var(--info); margin-top:3px; }
  .explain p { margin:0 0 6px; } .explain p:last-child { margin:0; } .explain b { color:var(--ink); }
  .explain details summary { cursor:pointer; color:var(--info); font-weight:600; list-style:none; margin-top:4px; }
  .explain details summary::-webkit-details-marker { display:none; }
  .notice { display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:var(--r-s); font-size:14px; margin-bottom:14px; border:1px solid transparent; }
  .notice svg { margin-top:2px; }
  .notice.warn { background:var(--warn-soft); color:var(--ink); border-color:color-mix(in srgb, var(--warn) 25%, transparent); } .notice.warn svg { color:var(--warn); }
  .notice.bad { background:var(--bad-soft); border-color:color-mix(in srgb, var(--bad) 25%, transparent); } .notice.bad svg { color:var(--bad); }
  .notice.ok { background:var(--ok-soft); border-color:color-mix(in srgb, var(--ok) 25%, transparent); } .notice.ok svg { color:var(--ok); }
  .notice.info { background:var(--info-soft); } .notice.info svg { color:var(--info); }
  .notice .t { flex:1; } .notice .t b { display:block; margin-bottom:2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:760px) { .grid2, .grid3, .grid4 { grid-template-columns:1fr; } }
  label.f { display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin:0 0 5px; }
  label.f span { font-weight:400; color:var(--muted); }
  input[type=text], input[type=search], select, textarea { font:inherit; width:100%; border:1px solid var(--line-2); border-radius:var(--r-s); background:var(--card); color:var(--ink); padding:8px 11px; transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:.8; }
  textarea { min-height:88px; font-family:var(--mono); font-size:13px; line-height:1.5; resize:vertical; }
  textarea.yaml { min-height:280px; }
  .hint { font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.45; }
  button, .btn { font:inherit; font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:var(--r-s); border:1px solid var(--line-2); background:var(--card); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:background .12s, border-color .12s; }
  button:hover { background:var(--soft); border-color:var(--muted); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button.danger { color:var(--bad); } button.danger:hover { background:var(--bad-soft); border-color:var(--bad); }
  button.ghost { border-color:transparent; background:transparent; color:var(--muted); padding:5px 8px; } button.ghost:hover { background:var(--soft); color:var(--ink); }
  button.sm { font-size:12.5px; padding:5px 10px; }
  button.xs { font-size:12px; padding:3px 8px; }
  button:disabled { opacity:.45; cursor:not-allowed; } button:disabled:hover { background:var(--card); border-color:var(--line-2); } button.primary:disabled:hover { background:var(--accent); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .cmd { font-family:var(--mono); font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; margin-left:auto; }
  .cmd button { padding:2px 5px; }
  .kv { display:grid; grid-template-columns:160px 1fr; gap:9px 16px; font-size:14px; align-items:baseline; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--soft-2); color:var(--muted); white-space:nowrap; line-height:1.6; }
  .pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.bad { background:var(--bad-soft); color:var(--bad); } .pill.warn { background:var(--warn-soft); color:var(--warn); } .pill.accent { background:var(--accent-soft); color:var(--accent); } .pill.info { background:var(--info-soft); color:var(--info); }
  .pill .dot { width:7px; height:7px; border-radius:50%; background:currentColor; } .pill.busy .dot { animation:blink 1s infinite; }
  .rows { display:flex; flex-direction:column; }
  .row { display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-top:1px solid var(--line); align-items:center; }
  .row:first-child { border-top:0; }
  .row .l { display:flex; align-items:center; gap:10px; min-width:0; } .row .l svg { color:var(--muted); }
  .row .meta { font-size:12.5px; color:var(--muted); }
  .choice { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:760px) { .choice { grid-template-columns:1fr; } }
  .choice button { text-align:left; padding:16px 18px; border-radius:var(--r); border:1.5px solid var(--line-2); background:var(--card); display:block; }
  .choice button:hover { border-color:var(--accent); background:var(--card); }
  .choice button.on { border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); }
  .choice b { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:15px; } .choice span { font-size:13px; color:var(--muted); font-weight:400; line-height:1.45; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; letter-spacing:.02em; padding:0 10px 8px 0; border-bottom:1px solid var(--line); }
  td { padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  .proj { border:1px solid var(--line); border-radius:var(--r-s); padding:12px 14px; margin-bottom:10px; background:var(--card); }
  .proj .top { display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .proj h4 { font-size:14.5px; display:flex; gap:8px; align-items:center; } .proj h4 .mono { font-weight:400; color:var(--muted); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:6px; background:var(--soft); color:var(--muted); border:1px solid var(--line); }
  .chip.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); }
  .chip.new { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:0 0 16px; }
  .tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 12px; color:var(--muted); margin-bottom:-1px; font-weight:500; }
  .tabs button:hover { color:var(--ink); background:none; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .stat { padding:14px 16px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--card); }
  .stat .v { font-size:22px; font-weight:650; letter-spacing:-.02em; } .stat .k { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .list { margin:4px 0 0; padding-left:18px; font-size:13.5px; } .list li { margin:2px 0; }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .stepnav { display:flex; justify-content:space-between; margin-top:26px; }
  .toast { position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--bg); padding:11px 15px; border-radius:10px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); font-size:13.5px; opacity:0; transform:translateY(6px); transition:all .2s; pointer-events:none; max-width:420px; }
  .toast.show { opacity:1; transform:none; }
  /* terminal */
  .term { background:var(--term); color:var(--term-ink); border-radius:var(--r); overflow:hidden; border:1px solid #1f262e; }
  .term .bar { display:flex; align-items:center; gap:10px; padding:9px 14px; background:#161b22; border-bottom:1px solid #1f262e; font-size:12.5px; color:#9aa5b1; }
  .term .bar .dots span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; background:#2d343c; }
  .term .bar code { background:none; border:0; color:#c9d1d9; padding:0; }
  .term .bar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .term .bar button { background:transparent; border:1px solid #2d343c; color:#9aa5b1; padding:2px 8px; font-size:12px; }
  .term .bar button:hover { color:#fff; background:#1f262e; }
  .term pre { margin:0; padding:12px 14px; max-height:380px; overflow:auto; font-size:12.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .term pre:empty::before { content:"Waiting for output…"; color:#6b7480; }
  .pipe { display:grid; grid-template-columns:1fr 36px 1fr 36px 1fr 36px 1fr; align-items:stretch; gap:0; }
  .pipe .stage { border:1px solid var(--line); border-radius:var(--r-s); padding:14px 16px; background:var(--card); cursor:pointer; min-width:0; }
  .pipe .stage:hover { border-color:var(--accent); }
  .pipe .stage .t { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .pipe .stage .v { font-size:20px; font-weight:650; margin:4px 0 2px; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pipe .stage .s { font-size:12.5px; color:var(--muted); line-height:1.4; }
  .pipe .arrow { display:grid; place-items:center; color:var(--line-2); position:relative; }
  .pipe .arrow.ok { color:var(--ok); } .pipe .arrow.stale { color:var(--warn); }
  .pipe .arrow svg { width:22px; height:22px; }
  .pipe .arrow .tip { position:absolute; top:calc(100% - 4px); left:50%; transform:translateX(-50%); font-size:11px; white-space:nowrap; color:inherit; }
  @media (max-width:900px) { .pipe { grid-template-columns:1fr; } .pipe .arrow { height:28px; } .pipe .arrow svg { transform:rotate(90deg); } .pipe .arrow .tip { display:none; } }
  .next { display:flex; gap:16px; align-items:center; padding:18px 20px; border-radius:var(--r); background:linear-gradient(135deg, var(--accent-soft), transparent 70%); border:1px solid var(--accent-line); margin-bottom:16px; }
  .next .n { width:40px; height:40px; border-radius:12px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:16px; flex:none; }
  .next .t { flex:1; } .next .t b { font-size:15px; display:block; } .next .t span { color:var(--muted); font-size:13.5px; }
  .srch { position:relative; } .srch svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); } .srch input { padding-left:34px; }
  .hit { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:13px; } .hit:first-child { border-top:0; }
  .empty { text-align:center; padding:28px 16px; color:var(--muted); font-size:14px; } .empty svg { width:28px; height:28px; stroke-width:1.5; color:var(--line-2); display:block; margin:0 auto 8px; }
  .bar-h { height:8px; border-radius:4px; background:var(--soft-2); overflow:hidden; display:flex; margin:10px 0 6px; } .bar-h span { height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12.5px; color:var(--muted); } .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  details.plain summary { cursor:pointer; color:var(--muted); font-size:13.5px; list-style:none; display:flex; align-items:center; gap:6px; } details.plain summary::-webkit-details-marker { display:none; }
  details.plain[open] summary svg.chev { transform:rotate(90deg); } summary svg.chev { transition:transform .15s; }
  /* machines, questions, steps panel, guided mode */
  .q3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:900px) { .q3 { grid-template-columns:1fr; } }
  .q { border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; background:var(--card); display:flex; flex-direction:column; gap:6px; }
  .q .qt { font-size:13px; color:var(--muted); font-weight:600; }
  .q .qa { font-size:18px; font-weight:650; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
  .q .qa svg { width:20px; height:20px; }
  .q.ok .qa { color:var(--ok); } .q.warn .qa { color:var(--warn); } .q.bad .qa { color:var(--bad); } .q.todo .qa { color:var(--muted); }
  .q .qw { font-size:13.5px; color:var(--ink-2); flex:1; } .q .qb { margin-top:6px; }
  .machines { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; }
  .mach { border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:14px 16px; cursor:pointer; position:relative; }
  .mach:hover { border-color:var(--accent); }
  .mach.sel { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .mach .mt { display:flex; justify-content:space-between; align-items:center; gap:8px; }

const dis = (extra = true) => (anyRunning() || !extra) ? 'disabled' : '';

function hasNeeds() { const n = o.needs; return !n.error && (n.images + n.pypi + n.npm + n.apt + (n.apk || 0) + (n.rpm || 0) + n.files) > 0; }

  if (!o.servers) return { done: 0, total: 0, bad: 0, names: [] };

function willDo(what, machines, mins, internet) {
  machines = [...new Set(machines)];
  return `<div class="will">${ic('info')}<div><b>What this does.</b> ${what}<ul><li>Touches: ${machines.length ? machines.map(m => `<code>${esc(m)}</code>`).join(', ') : 'only this computer'}</li><li>Usually takes ${esc(mins)}</li><li>${internet ? 'Needs internet on this computer' : 'Needs no internet anywhere'}</li></ul></div></div>`;
}
function allHosts() { return o.servers ? [...new Set([o.servers.gitea.host, ...Object.values(o.servers.infrastructures).flatMap(i => i.nodes)])] : []; }
function explain(html, more = '') {
  return `<div class="explain">${ic('info', 'lg')}<div>${html}${more ? `<details><summary>How it works</summary>${more}</details>` : ''}</div></div>`;
}
function notice(kind, html) { return `<div class="notice ${kind}">${ic(kind === 'ok' ? 'check-circle' : kind === 'info' ? 'info' : 'alert')}<div class="t">${html}</div></div>`; }
function need(cond, html) { return cond ? '' : notice('warn', html); }
function card(title, icon, body, foot = '', extra = '') {
  return `<div class="card"><div class="hd"><h3>${icon ? ic(icon) : ''}${title}</h3>${extra}</div><div class="bd">${body}</div>${foot ? `<div class="ft">${foot}</div>` : ''}</div>`;
}
function empty(icon, text) { return `<div class="empty">${ic(icon)}${text}</div>`; }

// =============================================================== home
function pageOverview() {
  const n = o.needs, b = o.box_status, s = o.sync, inf = infraStatus(), sh = sealedHosts(), nxt = nextStep();
  const fresh = !o.state.gitea && !o.box && isTemplate();
  let html = head('Home', fresh ? 'Welcome. Nothing is set up yet; the list below is the whole job, in order.' : 'Three questions, answered from the files in this folder and the last look at each machine.',
    o.sync.times.fetch ? `last download ${esc(ago(o.sync.times.fetch))}<br>last push to Gitea ${esc(ago(o.sync.times.upload))}` : '');
  if (fresh) return html + guided();
  // --- the three questions
  const q1 = !o.box ? ['todo', 'Nothing downloaded yet', 'The box is empty. Download the supplies while this computer has internet.', 'fetch', 'Download']
    : b.missing_total ? ['warn', `${b.missing_total} thing${b.missing_total > 1 ? 's' : ''} missing`, `${b.missing_total} item${b.missing_total > 1 ? 's' : ''} from the needs are not in the box yet.`, 'fetch', 'Download what is missing']
    : fetchFailures(o.state.fetch).length ? ['warn', 'Some downloads failed', `${fetchFailures(o.state.fetch).length} item(s) could not be downloaded last time.`, 'fetch', 'See which']
    : ['ok', 'Yes, everything', `${b.files} files, ${mb(b.bytes)}, covering every need of ${o.needs_files.length} project${o.needs_files.length === 1 ? '' : 's'}.`, 'needs', 'The projects'];
  const q2 = !o.state.gitea ? ['todo', 'No local server yet', 'Gitea, the server that replaces the internet for your machines, is not installed.', 'gitea', 'Install it']
    : !o.state.upload ? ['warn', 'Server is empty', `Gitea runs on ${o.state.gitea.host} but the box has not been pushed into it.`, 'upload', 'Fill it']
    : s.arrows.upload.state === 'stale' ? ['warn', 'Server is behind', `${o.box_changes.new_files} file${o.box_changes.new_files === 1 ? '' : 's'} in the box are newer than the last push.`, 'upload', 'Push the new files']
    : ['ok', 'Yes, it has it all', `Gitea ${o.state.gitea.version} on ${o.state.gitea.host} holds the box. Pushed ${ago(s.times.upload)}.`, 'gitea', 'Gitea'];
  const q3 = !inf.total ? ['todo', 'No servers declared', 'Add the machines that will run your applications.', 'servers', 'Add servers']
    : !inf.done && !inf.bad ? ['todo', 'Not set up yet', `${inf.total} infrastructure${inf.total > 1 ? 's' : ''} declared, none set up.`, 'infra', 'Set them up']
    : inf.bad ? ['bad', 'Problems found', `${inf.bad} infrastructure${inf.bad > 1 ? 's have' : ' has'} failed checks.`, 'infra', 'See what failed']
    : sh.off ? ['bad', `${sh.off} machine${sh.off > 1 ? 's' : ''} OPEN`, 'When last looked at, the internet was on there. Seal it, or this is deliberate: check the reason in its log.', 'machines', 'Machines']
    : sh.dead ? ['warn', `${sh.dead} unreachable`, 'A machine did not answer over SSH when last looked at.', 'machines', 'Machines']
    : inf.done < inf.total ? ['warn', `${inf.done} of ${inf.total} set up`, 'Some infrastructures are not set up yet.', 'infra', 'Finish']
    : s.arrows.setup.state === 'stale' ? ['warn', 'Verified before the last push', 'New files went to Gitea after the servers were last checked. Check again to be sure.', 'infra', 'Check again']
    : ['ok', 'Yes, sealed and checked', `${inf.total} infrastructure${inf.total > 1 ? 's' : ''}, ${sh.on} machine${sh.on === 1 ? '' : 's'} with the internet switched off, every check green.`, 'prove', 'Prove it'];
  const qcard = (title, q) => `<div class="q ${q[0]}"><div class="qt">${title}</div><div class="qa">${ic(q[0] === 'ok' ? 'check-circle' : q[0] === 'todo' ? 'clock' : 'alert')}${esc(q[1])}</div><div class="qw">${esc(q[2])}</div><div class="qb"><button class="sm ${q[0] === 'ok' ? '' : 'primary'}" onclick="go('${q[3]}')">${esc(q[4])} ${ic('arrow')}</button></div></div>`;
  html += `<div class="q3">${qcard('Is everything downloaded?', q1)}${qcard('Does the local server have it?', q2)}${qcard('Are the servers sealed and working?', q3)}</div>`;
  if (nxt) html += `<div class="next"><div class="n">${STEPS.indexOf(nxt) + 1}</div><div class="t"><b>Next: ${esc(nxt.title)}</b><span>${esc(nextWhy(nxt.id))}</span></div><button class="primary" onclick="go('${nxt.id}')">Open ${ic('arrow')}</button></div>`;
  else if (o.state.demo) html += `<div class="next"><div class="n">${ic('check')}</div><div class="t"><b>Everything is set up, sealed and verified.</b><span>From here on: change a project, download, push. The three questions above tell you when something is behind.</span></div><button onclick="window.open('/report.html','_blank')">${ic('file')} Proof report</button></div>`;
  // --- the picture
  const arrow = key => { const a = s.arrows[key]; return `<div class="arrow ${a.state}" title="${esc(a.why)}">${ic('arrow')}<span class="tip">${a.state === 'ok' ? 'in sync' : a.state === 'stale' ? 'behind' : ''}</span></div>`; };
  const projects = o.needs_files.filter(f => f.name !== 'demo').length || o.needs_files.length;
  html += `<div class="card"><div class="hd"><h3>${ic('zap')}How things flow <small>click a stage</small></h3></div><div class="bd" style="padding-bottom:30px"><div class="pipe">
    <div class="stage" onclick="go('needs')"><div class="t">${ic('layers')} Projects need</div><div class="v">${n.error ? '!' : n.images + n.pypi + n.npm + n.apt + (n.apk || 0) + (n.rpm || 0) + n.files}</div><div class="s">${n.error ? esc(n.error) : `items from ${projects} project${projects === 1 ? '' : 's'}`}</div></div>
    ${arrow('fetch')}
    <div class="stage" onclick="go('fetch')"><div class="t">${ic('box')} Box on this computer</div><div class="v">${o.box ? mb(b.bytes) : '—'}</div><div class="s">${o.box ? `${b.files} files${b.missing_total ? `, <span class="warn">${b.missing_total} missing</span>` : ''}` : 'nothing downloaded yet'}</div></div>
    ${arrow('upload')}
    <div class="stage" onclick="go('gitea')"><div class="t">${ic('globe')} Local internet</div><div class="v" title="${esc(o.state.gitea?.name || '')}">${o.state.gitea ? esc(o.state.gitea.name) : '—'}</div><div class="s">${o.state.gitea ? (o.state.upload ? 'has the box' : 'installed, still empty') : 'not installed'}</div></div>
    ${arrow('setup')}
    <div class="stage" onclick="go('machines')"><div class="t">${ic('shield')} Servers</div><div class="v">${inf.total ? `${inf.done}/${inf.total}` : '—'}</div><div class="s">${inf.total ? 'infrastructures verified' : 'none declared'}</div></div>
  </div></div></div>`;
  // --- attention
  const bad = o.preflight.filter(c => !c.ok), fails = fetchFailures(o.state.fetch), parts = [];
  if (o.error) parts.push(notice('bad', `<b>servers.yml has a problem</b>${esc(o.error)}`));
  for (const f of o.needs_files.filter(f => f.error)) parts.push(notice('bad', `<b>${esc(f.file)} cannot be read</b>${esc(f.error)}`));
  for (const c of bad) parts.push(notice('warn', `<b>${esc(c.name)}: ${esc(c.detail)}</b>Needed for ${esc(c.need)}.`));
  if (fails.length) parts.push(notice('warn', `<b>The last download could not get ${fails.length} item${fails.length > 1 ? 's' : ''}.</b><a href="#fetch" onclick="go('fetch');return false">See which.</a>`));
  for (const [a, items] of Object.entries(o.drift || {})) parts.push(notice('info', `<b>${esc(a)} is not at the pinned versions:</b> ${esc(items.join(', '))}. Run Set up again for its infrastructure to bring it up to date.`));
  if (o.state.gitea && !o.backups.length) parts.push(notice('info', `<b>No backup of Gitea yet.</b><a href="#maintain" onclick="go('maintain');return false">Make one</a>; it takes a minute and Gitea is the only copy of everything.`));
  if (parts.length) html += `<div class="card"><div class="hd"><h3>${ic('alert')}Needs attention</h3></div><div class="bd" style="padding-bottom:4px">${parts.join('')}</div></div>`;
  html += `<div class="grid2">
    ${card('Recent activity', 'activity', o.runs.length ? `<div class="rows">${o.runs.slice(0, 5).map(runRow).join('')}</div>` : empty('activity', 'Nothing has run from here yet. Every button you press is listed here afterwards, in plain words.'), `<button class="sm" onclick="go('activity')">All history →</button>`)}
    ${card('This computer', 'cpu', `<div class="rows">${o.preflight.map(c => `<div class="row"><div class="l">${ic(c.ok ? 'check-circle' : 'alert')}<span>${esc(c.name)}</span></div><span class="meta ${c.ok ? '' : 'warn'}" title="${esc(c.need)}">${esc(c.detail)}</span></div>`).join('')}</div>`)}
  </div>`;
  return html;
}
// First hour: one path, in order, with what each step is and how long it takes. Disappears once Gitea is up.
function guided() {
  const nxt = nextStep();
  let html = `<div class="explain">${ic('info', 'lg')}<div><p><b>What Outpost does, in one breath.</b> You download everything your projects need onto this computer, push it into one server called Gitea, and tell your other servers to use only that Gitea. Then you switch their internet off and prove it.</p>
    <p>Each step below is one page with one main button. The page says what will happen before you press it, and tells you in plain words what it did. Nothing here needs you to type commands.</p></div></div>`;
  html += `<div class="card"><div class="hd"><h3>${ic('zap')}Start here</h3><small>${nxt ? 'next: ' + esc(nxt.title) : ''}</small></div><div class="bd guide" style="padding-top:4px;padding-bottom:4px">${STEPS.map((s, i) => { const done = stepDone(s.id), isNext = nxt && nxt.id === s.id; return `<div class="g ${done ? 'done' : ''} ${isNext ? 'next' : ''}"><div class="n">${done ? ic('check') : i + 1}</div><div class="t"><b>${esc(s.title)}</b><span>${esc(s.short)}. Usually ${esc(s.mins)}.</span></div>${isNext ? `<button class="primary" onclick="go('${s.id}')">Start ${ic('arrow')}</button>` : `<button class="ghost sm" onclick="go('${s.id}')">Open</button>`}</div>`; }).join('')}</div></div>`;
  html += `<div class="grid2">${card('No servers?', 'flask', `<p style="margin:0;color:var(--ink-2)">Step 1 can create a <b>practice lab</b>: four small servers as Docker containers on this computer. Every other step then works exactly as it would on real machines, so you can see the whole thing in about twenty minutes before touching anything real.</p>`, `<button class="sm" onclick="go('servers','lab')">${ic('flask')}Create a lab</button>`)}
    ${card('This computer', 'cpu', `<div class="rows">${o.preflight.map(c => `<div class="row"><div class="l">${ic(c.ok ? 'check-circle' : 'alert')}<span>${esc(c.name)}</span></div><span class="meta ${c.ok ? '' : 'warn'}" title="${esc(c.need)}">${esc(c.detail)}</span></div>`).join('')}</div>`)}</div>`;
  return html;
}
function nextWhy(id) {
  return { servers: 'Say which SSH hosts play which role, or create a lab in Docker if you have none.',
    needs: hasNeeds() ? 'Only the demo project is here. Scan one of your own projects, or carry on: the demo is enough to see everything work.' : 'Point Outpost at a project folder or a lockfile.',
    fetch: o.box ? 'Some needs are not in the box yet, or the last fetch had failures.' : 'Download everything into the box while you have internet.',
    gitea: 'Install Gitea on its server over SSH and seal that server.',
    upload: o.state.upload ? 'The box changed after the last upload.' : 'Push the box into Gitea\'s registries.',
    infra: 'Configure the nodes, seal them, install Docker or k3s from Gitea, verify.',
    deploy: 'Push the demo project; Gitea Actions builds it on a sealed node and deploys it everywhere.',
    prove: 'Run a smoke check: build an image on a sealed node from Gitea alone.' }[id] || '';
}
function runRow(r) {
  const st = r.running ? pill('accent busy', 'running') : r.exit === null ? pill('', 'cut short') : r.exit === 0 ? pill('ok', 'ok') : pill('bad', 'failed');
  return `<div class="row" style="cursor:pointer" onclick="openRun('${esc(r.id)}')"><div class="l">${ic(r.exit === 0 ? 'check-circle' : r.running ? 'clock' : 'alert')}<span><b style="font-weight:500">${esc(r.summary || r.command)}</b><div class="hint" style="margin:0"><span class="mono">${esc(r.command)}</span></div></span></div><span class="meta" style="white-space:nowrap">${esc(ago(r.when))}${r.seconds != null ? ' · ' + r.seconds + 's' : ''} &nbsp;${st}</span></div>`;
}

// =============================================================== machines
function machineState(h) {
  if (!h) return ['', 'never looked at'];
  if (!h.reachable) return ['bad', 'unreachable'];
  const sealed = String(h.egress).startsWith('sealed');
  return [sealed ? 'ok' : h.egress === 'not installed' ? '' : 'bad', sealed ? SEAL.on : h.egress === 'not installed' ? 'not set up yet' : SEAL.off];
}
function pageMachines() {
  const roles = o.roles || {}, aliases = Object.keys(roles), sh = sealedHosts();
  let html = head('Machines', 'Every server, what is on it, and whether its internet is switched off. From the last look over SSH; press Look again for a fresh one.',
    aliases.length ? `${sh.on} of ${aliases.length} sealed${sh.off ? `, <span class="bad">${sh.off} open</span>` : ''}${sh.dead ? `, <span class="warn">${sh.dead} unreachable</span>` : ''}` : '');
  if (!o.servers) return html + card('No machines yet', 'cpu', empty('server', 'A machine is any server you can reach with ssh. Add them in step 1, or create a practice lab.'), `<button class="primary sm" onclick="go('servers')">Add servers ${ic('arrow')}</button>`);
  const g = o.servers.gitea;
  html += `<div class="diagram">
    <div class="box solid"><b>This computer</b>downloads, then talks to every server over SSH</div><div class="arr">${ic('arrow')}</div>
    <div class="box ${o.state.gitea ? 'solid' : ''}"><b>${esc(g.host)}</b>the local internet: Gitea at https://${esc(g.name)}</div><div class="arr">${ic('arrow')}</div>
    <div class="box ${infraStatus().done ? 'solid' : ''}"><b>${aliases.length - 1} server${aliases.length === 2 ? '' : 's'}</b>${Object.entries(o.servers.infrastructures).map(([n, i]) => `${esc(n)} (${TYPES[i.type]})`).join(', ') || 'no infrastructures yet'}</div></div>`;
  html += `<div class="actions" style="margin-bottom:14px"><button class="primary" ${ui.hostsBusy ? 'disabled' : ''} onclick="refreshHosts()">${ic('refresh')}${ui.hostsBusy ? 'Looking…' : 'Look again at every machine'}</button>
    <label class="toggle"><input type="checkbox" ${ui.heartbeat ? 'checked' : ''} onchange="setHeartbeat(this.checked)"> Look again every 5 minutes while this page is open</label>${cmdHint(['hosts', '--refresh'])}</div>`;
  html += `<div class="machines">${aliases.map(a => machineCard(a, roles[a], o.hosts[a])).join('')}</div>`;
  if (ui.machine && roles[ui.machine]) html += machineDetail(ui.machine, roles[ui.machine], o.hosts[ui.machine]);
  return html;
}
function machineCard(alias, roles, h) {
  const [cls, text] = machineState(h), inst = h?.installed ? Object.entries(h.installed).filter(([, v]) => v) : [];
  const drift = (o.drift || {})[alias] || [];
  return `<div class="mach ${ui.machine === alias ? 'sel' : ''}" onclick="ui.machine='${esc(alias)}';render();document.getElementById('mdetail')?.scrollIntoView({behavior:'smooth',block:'nearest'})">
    <div class="mt"><h4>${ic('server')}${esc(alias)}</h4><span class="lamp ${cls}" title="${esc(text)}"></span></div>
    <div class="roles">${esc(roles.join(' · '))}</div>
    ${h && h.reachable ? `<dl class="facts"><dt>Internet</dt><dd class="${cls}">${esc(text)}</dd><dt>System</dt><dd title="${esc(h.pretty || '')}">${esc(h.pretty || h.id || '?')}, ${esc(h.arch || '')}</dd><dt>Address</dt><dd class="mono">${esc(h.ip || '?')}</dd>
      <dt>Running</dt><dd>${inst.length ? inst.map(([k, v]) => `<span class="ver ${drift.some(d => d.startsWith(k + ' ')) ? 'drift' : ''}" title="${esc(k)} ${esc(v)}">${esc(k)}</span>`).join(' ') : 'nothing from Outpost yet'}</dd>
      <dt>Disk</dt><dd>${esc(h.disk_free || '?')} free${h.disk_pct ? ' (' + esc(h.disk_pct) + '% used)' : ''}</dd><dt>Up</dt><dd>${esc(h.uptime || '?')}</dd></dl>`
      : h ? `<div class="bad" style="font-size:13px">${esc(h.error || 'no answer')}</div>` : `<div class="hint" style="margin:0">Not looked at yet. Set up runs do this by themselves; or press Look again.</div>`}
    <div class="seen">${h ? 'last looked at ' + esc(ago(h.seen)) : ''}</div></div>`;
}

    `<div class="grid2"><div><dl class="kv">
        <dt>Internet</dt><dd>${pill(cls, text)} ${h.egress_boot === 'enabled' ? '<span class="hint" style="display:inline">· comes back at boot</span>' : h.egress !== 'not installed' ? '<span class="warn hint" style="display:inline">· NOT restored at boot</span>' : ''}</dd>

        <dt>Resources</dt><dd>${esc(h.cpus || '?')} cpu · ${h.mem_total ? Math.round(h.mem_used / h.mem_total * 100) + '% of ' + Math.round(h.mem_total / 1024) + ' GB memory' : '?'} · load ${esc(h.load || '?')} · disk ${esc(h.disk_free || '?')} free of ${esc(h.disk_total || '?')}</dd>
        <dt>Booted</dt><dd>${esc(h.booted || '?')} (${esc(h.uptime || '')})</dd></dl></div>

        ${Object.entries(h.installed).filter(([, v]) => v).map(([k, v]) => { const want = o.versions[k], svc = { gitea: 'gitea', docker: 'docker', k3s: h.services.k3s ? 'k3s' : 'k3s-agent', coredns: 'outpost-dns', runner: 'outpost-runner' }[k]; const ok = !want || v === want || (k === 'k3s' && v.split('+')[0] === want.split('+')[0]); return `<tr><td>${esc(k)}</td><td class="ver ${ok ? '' : 'drift'}">${esc(v)}</td><td class="ver muted">${esc(want || '')}</td><td>${svc ? (h.services[svc] === 'active' ? `<span class="ok">${ic('check')} running</span>` : `<span class="muted">${esc(h.services[svc] || '—')}</span>`) : ''}</td></tr>`; }).join('') || '<tr><td colspan=4 class="muted">nothing installed by Outpost yet</td></tr>'}</table>

    ${String(h.egress).startsWith('sealed') ? `<button class="sm" ${dis()} onclick="const r=prompt('Why open the internet on ${esc(alias)}? (written to its log)'); if(r!==null) run('machines', ['egress','${esc(alias)}','open','--reason',r||'from the dashboard'])">${ic('unlock')}Switch internet ON</button>` : `<button class="sm primary" ${dis()} onclick="run('machines', ['egress','${esc(alias)}','seal','--reason','from the dashboard'])">${ic('lock')}Switch internet OFF</button>`}` : ''}
    ${isGitea ? `<button class="sm" ${dis()} onclick="run('machines', ['gitea','setup'])">${ic('play')}Run Gitea setup again</button>` : infra ? `<button class="sm" ${dis()} onclick="run('machines', ['infra','setup','${esc(infra)}'])">${ic('play')}Run setup again (${esc(infra)})</button>` : ''}
    <button class="ghost sm" onclick="ui.machine=null;render()">${ic('x')}Close</button>` : `<button class="sm" onclick="refreshHosts(['${esc(alias)}'])">${ic('refresh')}Look again</button><button class="ghost sm" onclick="ui.machine=null;render()">${ic('x')}Close</button>`;
  return `<div id="mdetail" style="margin-top:16px">${card(`${esc(alias)} <small>${esc(roles.join(' · '))}</small>`, 'server', body, foot, h ? `<small>looked at ${esc(ago(h.seen))}</small>` : '')}</div>`;

function workloads(h) {
  const w = h.workloads || {}, rows = [];
  if (w.compose_projects?.length) rows.push(`<li><b>Compose projects:</b> ${w.compose_projects.map(esc).join(', ')}</li>`);
  if (w.stacks?.length) rows.push(`<li><b>Swarm stacks:</b> ${w.stacks.map(esc).join(', ')}${w.services?.length ? ' (' + w.services.map(esc).join('; ') + ')' : ''}</li>`);
  if (w.deployments?.length) rows.push(`<li><b>Kubernetes deployments:</b> ${w.deployments.map(esc).join(', ')} · ${w.pods} pod${w.pods === 1 ? '' : 's'} running</li>`);
  if (w.containers) rows.push(`<li><b>${w.containers} container${w.containers === 1 ? '' : 's'}</b> running</li>`);
  if (h.gitea_repos) rows.push(`<li><b>Gitea:</b> ${esc(h.gitea_repos)} repositories, ${esc(h.gitea_packages_mb || 0)} MB of packages</li>`);
  return `<div style="margin-top:12px"><b style="font-size:13px">What runs here</b><ul class="list">${rows.join('') || '<li class="muted">no applications yet</li>'}</ul></div>`;
}
async function refreshHosts(aliases) {
  if (ui.hostsBusy) return;
  ui.hostsBusy = true; render();
  const r = await api('/api/hosts', 'POST', { aliases: aliases || null });
  ui.hostsBusy = false;
  if (r.error) toast('Could not look: ' + r.error, 6000);

function verifyTable(v) {

}

function stepsList(steps, running) {
  if (!steps || !steps.length) return running ? `<ul class="steps"><li class="cur"><span class="ico"></span>Starting…</li></ul>` : '';
  return `<ul class="steps">${steps.map((st, i) => `<li class="${st.done ? 'done' : 'cur'}"><span class="ico"></span>${st.of ? `<span class="muted">${st.n}/${st.of}</span> ` : ''}${esc(st.text)}</li>`).join('')}</ul>`;
}
function runPanel(page) {
  const r = runs[page]; if (!r) return '';
  const status = r.running ? pill('accent busy', `running · ${r.seconds || 0}s`) : r.exit === 0 ? pill('ok', 'finished') : pill('bad', `failed`);
  const tail = !r.running && r.exit !== 0 ? r.log.trim().split('\n').filter(l => !l.startsWith('[outpost exit')).slice(-4).join('\n') : '';
  const failed = !r.running && r.exit !== 0;
  return `${failed ? (r.explain ? `<div class="fix">${ic('alert')}<div><b>${esc(r.explain.title)}</b><div class="fx">${esc(r.explain.fix)}</div><div class="hint">Outpost said: <span class="mono">${esc(r.explain.line)}</span></div></div></div>`
      : notice('bad', `<b>outpost ${esc(r.args.join(' '))} failed.</b><pre class="mono" style="margin:6px 0 0;white-space:pre-wrap;font-size:12px">${esc(tail)}</pre>`)) : ''}
    ${!r.running && r.exit === 0 && r.summary ? notice('ok', `<b>${esc(r.summary)}.</b>`) : ''}
    <div class="term" id="runpanel" style="margin-bottom:16px"><div class="bar"><span class="dots"><span></span><span></span><span></span></span><code>$ outpost ${esc(r.args.join(' '))}</code>
      <span class="right"><span id="runstatus">${status}</span><button onclick="copy(runs['${page}'].log)">${ic('copy')} copy</button>${!r.running ? `<button onclick="delete runs['${page}'];render()">${ic('x')}</button>` : ''}</span></div>
      <div id="runsteps">${stepsList(r.steps, r.running)}</div>
      <details ${failed ? 'open' : ''}><summary style="padding:8px 14px;color:#9aa5b1;cursor:pointer;font-size:12.5px;list-style:none">${ic('chev', 'chev')} details (the full output)</summary><pre id="runlog">${esc(r.log || '')}</pre></details></div>`;
}
async function run(page, args) {
  if (currentRun) { toast('Wait for the running command to finish.'); return; }
  const r = await api('/api/run', 'POST', { args });
  if (r.error) { toast(r.error, 6000); return; }
  runs[page] = { id: r.id, args, running: true, log: '', seconds: 0 };
  currentRun = { page, id: r.id }; dirty = false;
  render(); poll();
  setTimeout(() => $('runpanel')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}
async function poll() {
  if (!currentRun) return;
  const s = await api('/api/run/' + currentRun.id);
  if (s.error) { setTimeout(poll, 2000); return; }
  const r = runs[currentRun.page];
  Object.assign(r, { running: s.running, exit: s.exit, log: s.log, seconds: s.seconds, steps: s.steps, explain: s.explain });
  const logEl = $('runlog');
  if (logEl && currentRun.page === view) {
    const stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
    logEl.textContent = s.log; if (stick) logEl.scrollTop = logEl.scrollHeight;
    const st = $('runstatus'); if (st) st.innerHTML = pill('accent busy', `running · ${s.seconds}s`);
    const se = $('runsteps'); if (se) se.innerHTML = stepsList(s.steps, s.running);
  }
  renderNav();
  if (s.running) { setTimeout(poll, 1000); return; }
  const page = currentRun.page; currentRun = null;
  const hist = await api('/api/runs'); const mine = (Array.isArray(hist) ? hist : []).find(x => x.id === r.id); r.summary = mine?.summary;
  toast(s.exit === 0 ? (r.summary || `outpost ${r.args.join(' ')} finished`) : (s.explain ? s.explain.title : `outpost ${r.args.join(' ')} failed, see the output`), 5000);
  if (page === 'servers' && r.args[0] === 'lab' && r.args[1] === 'up') ui.serversMode = 'lab';
  await refresh(true);
  if (page === 'deploy' && s.exit === 0) demoStatus();
}

// =============================================================== refresh loop
const PAGE_OF = { lab: 'servers', fetch: 'fetch', pack: 'fetch', gitea: 'gitea', upload: 'upload', infra: 'infra', check: 'prove', egress: 'prove', needs: 'needs', demo: 'deploy', hosts: 'machines', report: 'maintain', pki: 'maintain' };
async function refresh(force = false) {
  const data = await api('/api/overview');
  if (data.error && !data.root) { $('page').innerHTML = notice('bad', `<b>Cannot reach the dashboard server.</b>${esc(data.error)}`); return; }
  o = data;
  if (!currentRun && data.running.length) { const r = data.running[0], pg = PAGE_OF[r.args[0]] || view; currentRun = { page: pg, id: r.id }; runs[pg] = { id: r.id, args: r.args, running: true, log: '' }; poll(); }
  if (force || (!dirty && !currentRun)) render(); else renderNav();
}
refresh(true).then(() => { const q = new URLSearchParams(location.search).get('scan'); if (q) { go('needs'); ui.lastFolder = q; scanFolder(q); } });
setInterval(() => { if (!currentRun) refresh(); }, 15000);
</script>
</body>
</html>
