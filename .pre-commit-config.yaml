# Format and lint on each commit, like scripts/format.sh and CI, with the settings in pyproject.toml.
# Install once in your clone: pip install pre-commit && pre-commit install
files: ^(outpost|tests)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        name: ruff sort imports
        args: [--select, I, --fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff-check
        types_or: [python, pyi]
